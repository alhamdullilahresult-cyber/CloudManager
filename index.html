<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boyfinity Script Manager</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: #09070f;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-image: radial-gradient(ellipse at 50% -20%, rgba(147, 51, 234, 0.2) 0%, transparent 60%);
            color: #f1edfa;
            padding: 24px;
            text-align: center;
        }

        .logo-badge {
            display: inline-block;
            background: linear-gradient(135deg, #9333ea, #4f46e5);
            color: white;
            font-weight: 800;
            font-size: 18px;
            padding: 10px 22px;
            border-radius: 10px;
            letter-spacing: 2px;
            margin-bottom: 20px;
            box-shadow: 0 6px 24px rgba(147, 51, 234, 0.5);
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 10px;
        }

        p {
            color: #6b5f8a;
            font-size: 15px;
            max-width: 400px;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .btn-cta {
            background: linear-gradient(135deg, #9333ea, #4f46e5);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 14px 32px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 16px rgba(147, 51, 234, 0.4);
            transition: all 0.2s;
            display: inline-block;
        }

        .btn-cta:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(147, 51, 234, 0.6);
        }

        .footnote {
            font-size: 12px;
            color: #3d2f5e;
            margin-top: 24px;
        }

        code {
            background: #18112e;
            padding: 2px 8px;
            border-radius: 4px;
            font-family: monospace;
            color: #a78bfa;
        }
    </style>
</head>

<body>
    <div>
        <div class="logo-badge">BOYFINITY</div>
        <h1>Script Manager Platform</h1>
        <p>Cloud-based Lua Script Management with Admin Dashboard and Public API for Roblox Executors.</p>
        <a href="/login" class="btn-cta">Admin Dashboard →</a>
        <div class="footnote">
            Public API: <code>/api/scripts/{id}</code> → returns plain text Lua
        </div>
    </div>
    <script>
        // If token exists, go straight to admin
        const token = localStorage.getItem('admin_token');
        if (token) window.location.href = '/admin';
    </script>
</body>

</html>
